name: CI

# story-10 AC1: PR/push → type-check → build → size gate (fail nếu bundle > 50KB gzip) → smoke test
# Playwright (API/SSE mock, không đụng backend thật). Action pin theo SHA commit (supply-chain — Dev Notes
# story-10), KHÔNG dùng tag `@vN` trần.
#
# ⚠ File này được viết cho `widget/` với vai trò REPO ROOT (package.json `repository` trỏ
# github.com/cluvix/livechat — thư mục này sẽ tách thành repo mở nguồn riêng, xem
# CLAUDE.md §Layout). Vì vậy KHÔNG dùng `working-directory` — mọi lệnh chạy ngay ở root checkout.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Đọc Node version từ .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Build (widget.js + widget.html → dist/)
        env:
          WIDGET_OUT_DIR: dist
        run: npm run build
      - name: Size gate (≤ 50 KB gzip)
        env:
          WIDGET_OUT_DIR: dist
        run: npm run size
      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        run: npm test
      - name: Upload Playwright report (khi fail)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
